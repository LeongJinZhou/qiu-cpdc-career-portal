# Firebase App Hosting configuration for QIU CPDC Career Portal
# Ensures production runtime optimizations, generous build resources, and database integration.
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 50
  concurrency: 80

env:
  - variable: DATABASE_URL
    value: "postgresql://postgres:postgres@localhost:5432/cpdc?schema=public"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDDD76pbjxGyooTL7RzD6IyL6XwHdXEDoI"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "qiu-cpdc-career-portal.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "qiu-cpdc-career-portal"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:986984518601:web:120c01b0c5248d610b0e18"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "986984518601"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "qiu-cpdc-career-portal.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: "qiu-cpdc-career-portal"
    availability:
      - BUILD
      - RUNTIME
  - variable: AUTH_MODE
    value: "firebase-google"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_AUTH_MODE
    value: "firebase-google"
    availability:
      - BUILD
      - RUNTIME
  # Secrets come from Cloud Secret Manager, never plain values in this public
  # repo. Create them once with:
  #   firebase apphosting:secrets:set session-secret
  #   firebase apphosting:secrets:set magic-link-secret
  - variable: SESSION_SECRET
    secret: session-secret
    availability:
      - RUNTIME
  - variable: MAGIC_LINK_SECRET
    secret: magic-link-secret
    availability:
      - RUNTIME
