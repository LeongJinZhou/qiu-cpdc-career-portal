# Render Blueprint for the QIU CPDC Career Portal.
# Render dashboard -> New -> Blueprint -> pick this repo.
#
# Secrets never live in this file:
#   - SESSION_SECRET and MAGIC_LINK_SECRET are generated by Render on first deploy.
#   - Keys marked `sync: false` are typed into the Render dashboard when the
#     Blueprint is created (LinkedIn / GitHub OAuth client id and secret).
#
# Adding a custom domain later: also set APP_BASE_URL to it, so OAuth redirect
# URIs match the domain the session cookie lives on.
#
# OAuth redirect URIs to register with each provider:
#   https://<service>.onrender.com/api/onboarding/oauth/linkedin/callback
#   https://<service>.onrender.com/api/onboarding/oauth/github/callback

services:
  - type: web
    name: qiu-cpdc-career-portal
    runtime: node
    plan: starter
    region: singapore
    branch: master
    buildCommand: npm ci && npm run build
    # Runs before each release goes live. db push never drops data without
    # --accept-data-loss, so a destructive schema change fails the deploy
    # instead of silently deleting rows. The seed is idempotent (upserts).
    preDeployCommand: npx prisma db push --skip-generate && npm run db:seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: qiu-cpdc-db
          property: connectionString
      # Seed only reference data + first admin; never demo/test users.
      - key: SEED_PROFILE
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MAGIC_LINK_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: firebase-google
      - key: NEXT_PUBLIC_AUTH_MODE
        value: firebase-google
      # Firebase web config is public by design (it ships to every browser).
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        value: AIzaSyDDD76pbjxGyooTL7RzD6IyL6XwHdXEDoI # gitleaks:allow (public Firebase web key)
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        value: qiu-cpdc-career-portal.firebaseapp.com
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        value: qiu-cpdc-career-portal
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        value: "1:986984518601:web:120c01b0c5248d610b0e18"
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        value: "986984518601"
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        value: qiu-cpdc-career-portal.firebasestorage.app
      - key: FIREBASE_PROJECT_ID
        value: qiu-cpdc-career-portal
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: qiu-cpdc-db
    plan: basic-256mb
    region: singapore
    databaseName: cpdc
    ipAllowList: []
